name: Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      coverage:
        description: Collect coverage and require 95% per package
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  platforms:
    uses: ./.github/workflows/platforms.yml
    with:
      coverage: ${{ github.event_name == 'schedule' || inputs.coverage == true }}
      verify: ${{ github.event_name == 'schedule' }}
